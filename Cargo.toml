[workspace]
resolver = "2"
members = ["crates/opencomply-core", "crates/opencomply-http", "crates/opencomply-headers", "crates/opencomply-cli"]

[workspace.package]
version = "0.3.7"
edition = "2021"
authors = ["vampirebeam"]
license = "Apache-2.0"
repository = "https://github.com/vampirebeam/OpenComply"
rust-version = "1.90"

[workspace.dependencies]
opencomply-core = { path = "crates/opencomply-core", version = "0.3.7" }
opencomply-http = { path = "crates/opencomply-http", version = "0.3.7" }
opencomply-headers = { path = "crates/opencomply-headers", version = "0.3.7" }
tokio = { version = "1.40", default-features = false, features = ["rt", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
ed25519-dalek = "2.1"
sha2 = "0.10"
schemars = "1.0"
proptest = { version = "1.5", default-features = false, features = ["std"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
