# CI for main and pull requests: fmt, clippy, tests on Linux / Windows / macOS, plus supply-chain checks.
# Release tags are not run here: the Release workflow requires this run (push to main) to have passed for the tagged commit.
# Weekly run re-checks dependencies for newly published advisories even when the code does not change.
# Least privilege: read-only token, actions pinned to full commit SHAs, no secrets; `pull_request` (not `_target`)
# so fork code never runs with write access.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # --no-fail-fast: a failing crate does not hide the tests of the crates after it on that OS.
      - name: Test
        run: cargo test --workspace --all-targets --locked --no-fail-fast

  # Workflow files: syntax, expressions and shell scripts (actionlint + shellcheck) and a security audit (zizmor, incl.
  # checks that each pinned SHA belongs to its action). Tools are pinned, checksummed prebuilt binaries.
  workflows:
    name: workflow lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_URL: https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      SHELLCHECK_URL: https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
      ZIZMOR_URL: https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          fetch() {
            curl --proto '=https' --tlsv1.2 -fsSL "$1" -o "$RUNNER_TEMP/$3"
            echo "$2  $RUNNER_TEMP/$3" | sha256sum -c -
          }
          fetch "$ACTIONLINT_URL" "$ACTIONLINT_SHA256" actionlint.tgz
          fetch "$SHELLCHECK_URL" "$SHELLCHECK_SHA256" shellcheck.tgz
          fetch "$ZIZMOR_URL" "$ZIZMOR_SHA256" zizmor.tgz
          tar -xzf "$RUNNER_TEMP/actionlint.tgz" -C "$bin" actionlint
          tar -xzf "$RUNNER_TEMP/shellcheck.tgz" -C "$bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          tar -xzf "$RUNNER_TEMP/zizmor.tgz" -C "$bin" zizmor
      - name: actionlint
        run: '"$RUNNER_TEMP/bin/actionlint" -shellcheck="$RUNNER_TEMP/bin/shellcheck" .github/workflows/*.yml'
      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/bin/zizmor" --format plain .github/workflows/'

  # Line coverage of the whole workspace and of each critical file must stay at or above its floor; the tool is a
  # pinned, checksummed prebuilt.
  coverage:
    name: coverage
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COV_URL: https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz
      COV_SHA256: 3fca950394a3c49457657c158b1619cec8dfd2647ae5b48746734c0ab969a522
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-llvm-cov
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "$COV_URL" -o "$RUNNER_TEMP/cov.tgz"
          echo "$COV_SHA256  $RUNNER_TEMP/cov.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cov.tgz" -C "$HOME/.cargo/bin" cargo-llvm-cov
          rustup component add llvm-tools-preview
      - name: Coverage
        run: cargo llvm-cov --workspace --all-targets --locked --summary-only --fail-under-lines 94
      # Files that decide results or guard output, secrets and network access have their own line floor.
      - name: Coverage per file
        run: |
          cargo llvm-cov report --summary-only | awk '
          BEGIN {
            split("builtin evaluate grade redact registry render rules", core, " ")
            for (i in core) min["opencomply-core/src/" core[i] ".rs"] = 95
            min["opencomply-cli/src/guard.rs"] = 95
            min["opencomply-core/src/signing.rs"] = 94
            min["opencomply-http/src/lib.rs"] = 93
            min["opencomply-headers/src/lib.rs"] = 89
          }
          ($1 in min) {
            seen[$1] = 1; pct = $10; sub(/%/, "", pct)
            printf "%-36s %7s (min %d%%)\n", $1, $10, min[$1]
            if (pct + 0 < min[$1]) bad = 1
          }
          END {
            for (f in min) if (!(f in seen)) { print "missing from report: " f; bad = 1 }
            exit bad
          }'

  supply-chain:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
