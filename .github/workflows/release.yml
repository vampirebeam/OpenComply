# Release binaries for a tag vX.Y.Z: build on each OS, package with LICENSE / NOTICE / third-party notices and a
# CycloneDX SBOM of that binary, attach to a DRAFT release with a .sha256 per archive. The maintainer reviews and
# publishes the draft by hand.
# Runs on a pushed tag, or by hand for an existing tag (workflow_dispatch) — the tag's code is built, never moved.
# Only the release jobs get `contents: write` (to upload release files); no other secrets, no signing keys in CI —
# official rule packs must already carry their signature in the tag (checked before anything is built).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Tag format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Version matches tag
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v${version}" = "${TAG}" || { echo "Cargo.toml ${version} != tag ${TAG}"; exit 1; }
      - name: Official rule packs are signed
        run: |
          shopt -s nullglob
          packs=(rules/*.toml)
          if [ ${#packs[@]} -gt 0 ]; then cargo run --locked -q -p opencomply-cli -- rules validate "${packs[@]}"; fi

  create:
    name: create draft release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Create draft
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes "Draft: review before publishing."
        env:
          GH_TOKEN: ${{ github.token }}
      # The installers at releases/latest/download/install.{sh,ps1}: one source, the plugin's own scripts.
      - name: Attach installers
        run: |
          dir=plugins/opencomply/skills/opencomply/scripts
          if [ -f "$dir/install.sh" ]; then
            gh release upload "$TAG" "$dir/install.sh" "$dir/install.ps1" --repo "$GITHUB_REPOSITORY"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # One SBOM per target (dependencies differ by OS), from Cargo.lock metadata only; the tool is a pinned, checksummed
  # prebuilt binary.
  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CDX_URL: https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz
      CDX_SHA256: 9bd3e599314f50810c9d98b8b68a617ff9d3cc20873968d90b29d121f6b226ff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Generate
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "$CDX_URL" -o "$RUNNER_TEMP/cdx.txz"
          echo "$CDX_SHA256  $RUNNER_TEMP/cdx.txz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/cdx.txz" -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/cargo-cyclonedx'
          mkdir _sbom
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            "$RUNNER_TEMP/cargo-cyclonedx" cyclonedx -q --manifest-path crates/opencomply-cli/Cargo.toml \
              --describe binaries --target "$t" --target-in-filename --spec-version 1.5 --format json --no-build-deps
            mv "crates/opencomply-cli/opencomply_bin_$t.cdx.json" "_sbom/$t.cdx.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: _sbom/
          if-no-files-found: error
          retention-days: 1

  build:
    name: build (${{ matrix.target }})
    needs: [create, sbom]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Third-party notices from the workflow's commit, for tags created before the file existed; same Cargo.lock only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _wf
          persist-credentials: false
          sparse-checkout: |
            THIRD-PARTY-NOTICES.txt
            Cargo.lock
          sparse-checkout-cone-mode: false
      - name: Third-party notices
        shell: bash
        run: |
          if [ ! -f THIRD-PARTY-NOTICES.txt ]; then
            cmp -s Cargo.lock _wf/Cargo.lock || { echo "Cargo.lock differs from the notices' lockfile"; exit 1; }
            cp _wf/THIRD-PARTY-NOTICES.txt THIRD-PARTY-NOTICES.txt
          fi
          rm -rf _wf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: _sbom
      - name: Build
        run: cargo build --release --locked -p opencomply-cli
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          name="opencomply-${TAG}-${TARGET}"
          mkdir "$name"
          cp "target/release/opencomply${EXT}" LICENSE NOTICE README.md THIRD-PARTY-NOTICES.txt "$name/"
          cp "_sbom/${TARGET}.cdx.json" "$name/sbom.cdx.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Upload to draft release
        shell: bash
        run: |
          gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
