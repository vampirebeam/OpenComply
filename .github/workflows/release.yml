# Release binaries for a tag vX.Y.Z: build on each OS, package with LICENSE / NOTICE / third-party notices and a
# CycloneDX SBOM of that binary, then create ONE draft release with every archive, its .sha256, both installers and a
# SHA256SUMS manifest of those five files. The maintainer signs SHA256SUMS offline, attaches SHA256SUMS.sig to the
# draft and publishes it by hand.
# Runs on a pushed tag, or by hand for an existing tag (workflow_dispatch) — the tag's code is built, never moved.
# Nothing is built unless CI passed for the exact commit the tag points to (run of ci.yml pushed to main, every
# required job green). Only `publish-draft` can write to releases; it runs no repository code. No secrets and no
# signing keys in CI — official rule packs must already carry their signature in the tag (checked first).
# `dry_run` (manual runs only) does everything except creating the draft and the provenance attestation.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true
      dry_run:
        description: "Check and build only: no draft release, no attestation"
        type: boolean
        default: false

permissions:
  contents: read

# One release run per tag at a time; a second run waits instead of racing the first.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAG: ${{ inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry_run == true }}

jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Tag format
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Commit of the tag
        id: commit
        run: echo "sha=$(git rev-parse "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
      - name: Version matches tag
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          test "v${version}" = "${TAG}" || { echo "Cargo.toml ${version} != tag ${TAG}"; exit 1; }
      - name: Official rule packs are signed
        run: |
          shopt -s nullglob
          packs=(rules/*.toml)
          if [ ${#packs[@]} -gt 0 ]; then cargo run --locked -q -p opencomply-cli -- rules validate "${packs[@]}"; fi

  # CI of the tag's commit, as pushed to main before tagging: the latest attempt of that run must be complete and every
  # required job must have succeeded. Still running → wait (at most 45 minutes); anything else → stop.
  ci-gate:
    name: CI passed for this commit
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      actions: read
    env:
      SHA: ${{ needs.verify.outputs.sha }}
      REQUIRED_JOBS: |
        check (ubuntu-latest)
        check (windows-latest)
        check (macos-latest)
        coverage
        supply chain (cargo-deny)
        workflow lint
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for CI of the commit
        run: |
          deadline=$(( $(date +%s) + 45 * 60 ))
          while :; do
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == env.SHA and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty')"
            if [ -z "$run" ]; then
              echo "::error::no CI run of ci.yml pushed to main for $SHA — push main and wait for CI before tagging"
              exit 1
            fi
            id="$(jq -r .id <<<"$run")"; status="$(jq -r .status <<<"$run")"; conclusion="$(jq -r '.conclusion // ""' <<<"$run")"
            echo "CI run $id: status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI run $id for $SHA did not finish within 45 minutes"
              exit 1
            fi
            sleep 30
          done
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run $id for $SHA concluded '$conclusion'"
            exit 1
          fi
          jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?filter=latest&per_page=100" --jq '.jobs[] | "\(.name)\t\(.conclusion)"')"
          failed=0
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            result="$(awk -F'\t' -v n="$name" '$1 == n { print $2 }' <<<"$jobs")"
            if [ "$result" = "success" ]; then
              echo "ok      $name"
            else
              echo "::error::required CI job '$name': ${result:-not found}"
              failed=1
            fi
          done <<<"$REQUIRED_JOBS"
          exit "$failed"

  # One SBOM per target (dependencies differ by OS), from Cargo.lock metadata only; the tool is a pinned, checksummed
  # prebuilt binary.
  sbom:
    name: SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CDX_URL: https://github.com/CycloneDX/cyclonedx-rust-cargo/releases/download/cargo-cyclonedx-0.5.9/cargo-cyclonedx-x86_64-unknown-linux-musl.tar.xz
      CDX_SHA256: 9bd3e599314f50810c9d98b8b68a617ff9d3cc20873968d90b29d121f6b226ff
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Generate
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL "$CDX_URL" -o "$RUNNER_TEMP/cdx.txz"
          echo "$CDX_SHA256  $RUNNER_TEMP/cdx.txz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/cdx.txz" -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/cargo-cyclonedx'
          mkdir _sbom
          for t in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-apple-darwin; do
            "$RUNNER_TEMP/cargo-cyclonedx" cyclonedx -q --manifest-path crates/opencomply-cli/Cargo.toml \
              --describe binaries --target "$t" --target-in-filename --spec-version 1.5 --format json --no-build-deps
            mv "crates/opencomply-cli/opencomply_bin_$t.cdx.json" "_sbom/$t.cdx.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: _sbom/
          if-no-files-found: error
          retention-days: 1

  # Read-only: each archive and its .sha256 go to a workflow artifact; nothing touches a release here.
  build:
    name: build (${{ matrix.target }})
    needs: [ci-gate, sbom]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      # Third-party notices from the workflow's commit, for tags created before the file existed; same Cargo.lock only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _wf
          persist-credentials: false
          sparse-checkout: |
            THIRD-PARTY-NOTICES.txt
            Cargo.lock
          sparse-checkout-cone-mode: false
      - name: Third-party notices
        shell: bash
        run: |
          if [ ! -f THIRD-PARTY-NOTICES.txt ]; then
            cmp -s Cargo.lock _wf/Cargo.lock || { echo "Cargo.lock differs from the notices' lockfile"; exit 1; }
            cp _wf/THIRD-PARTY-NOTICES.txt THIRD-PARTY-NOTICES.txt
          fi
          rm -rf _wf
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: _sbom
      - name: Build
        run: cargo build --release --locked -p opencomply-cli
      # The Linux binary must run on glibc 2.34 (RHEL / AlmaLinux / Rocky 9, Amazon Linux 2023, Ubuntu 22.04+,
      # Debian 12+): fail if it needs a newer symbol, then run it on that glibc (official image pinned by digest,
      # no network, non-root, read-only).
      - name: glibc baseline
        if: runner.os == 'Linux'
        env:
          BASELINE: "2.34"
          IMAGE: almalinux:9.8-minimal-20261002@sha256:8e56ca192f602eb1c486b870f268730f4b08179b43845184a3623c6634f5d01a
        run: |
          need=$(objdump -T target/release/opencomply | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "binary needs glibc ${need}, baseline ${BASELINE}"
          [ -n "$need" ] || { echo "::error::no GLIBC symbol versions found"; exit 1; }
          [ "$(printf '%s\n%s\n' "$need" "$BASELINE" | sort -V | tail -1)" = "$BASELINE" ] || { echo "::error::binary needs glibc ${need} > ${BASELINE}"; exit 1; }
          docker run --rm --network none --read-only --user 65534:65534 --cap-drop ALL \
            -v "$PWD/target/release:/b:ro" "$IMAGE" \
            sh -c 'ldd --version | head -1 && /b/opencomply --version && /b/opencomply standards --format json && /b/opencomply schema report > /dev/null'
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          name="opencomply-${TAG}-${TARGET}"
          mkdir "$name" _dist
          cp "target/release/opencomply${EXT}" LICENSE NOTICE README.md THIRD-PARTY-NOTICES.txt "$name/"
          cp "_sbom/${TARGET}.cdx.json" "$name/sbom.cdx.json"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "_dist/$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar -czf "_dist/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd _dist
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: _dist/
          if-no-files-found: error
          retention-days: 1

  # The only job that can write to releases. It runs no repository code (no build, no cache): it checks the three
  # archives against their .sha256, writes SHA256SUMS (archives + installers, sorted by name), attests the archives'
  # provenance, and creates the draft once with every file. An existing release for the tag is never overwritten.
  publish-draft:
    name: create draft release
    needs: [verify, ci-gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: |
            plugins/opencomply/skills/opencomply/scripts/install.sh
            plugins/opencomply/skills/opencomply/scripts/install.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check archives
        run: |
          cd dist
          expected=(
            "opencomply-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "opencomply-${TAG}-x86_64-pc-windows-msvc.zip"
            "opencomply-${TAG}-aarch64-apple-darwin.tar.gz"
          )
          for f in "${expected[@]}"; do
            [ -f "$f" ] && [ -f "$f.sha256" ] || { echo "::error::missing $f or $f.sha256"; exit 1; }
            sha256sum -c "$f.sha256"
          done
          extra=()
          for f in ./*; do
            f="${f#./}"; keep=0
            for e in "${expected[@]}"; do
              if [ "$f" = "$e" ] || [ "$f" = "$e.sha256" ]; then keep=1; fi
            done
            [ "$keep" = 1 ] || extra+=("$f")
          done
          [ "${#extra[@]}" -eq 0 ] || { echo "::error::unexpected files: ${extra[*]}"; exit 1; }
          cp ../plugins/opencomply/skills/opencomply/scripts/install.sh ../plugins/opencomply/skills/opencomply/scripts/install.ps1 .
          LC_ALL=C sha256sum -- "${expected[@]}" install.sh install.ps1 | LC_ALL=C sort -k 2 > SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 5 ] || { echo "::error::SHA256SUMS must list 5 files"; exit 1; }
          sha256sum -c SHA256SUMS
          ls -l
          cat SHA256SUMS
      - name: Existing release
        id: existing
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "a release for $TAG exists — a real run would stop here (dry run: not touched)"
            else
              echo "::error::a release for $TAG already exists — delete the old draft by hand to rebuild"
              exit 1
            fi
          fi
      - name: Provenance
        if: env.DRY_RUN != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/opencomply-*.tar.gz
            dist/opencomply-*.zip
      - name: Create draft
        if: env.DRY_RUN != 'true'
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
            --notes "Draft: review before publishing." dist/*
      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: |
          echo "dry run for $TAG - checks passed, no release created, no attestation"
